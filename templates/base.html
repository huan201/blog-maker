<!DOCTYPE html>
<html lang="{{ lang }}" data-appearance="{{ appearance }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="author" content="{{ author }}">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{ canonical }}">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta property="og:site_name" content="{{ site_title }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ base }}static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ base }}static/favicon.svg">
<link rel="alternate" type="application/rss+xml" title="RSS" href="{{ rss_url }}">
<link rel="stylesheet" href="{{ base }}static/css/style.css">
{{ extra_head }}
<script>
  (function () {
    try {
      var saved = localStorage.getItem('blog-appearance');
      var mode = saved || '{{ appearance }}';
      if (mode === 'auto') {
        mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = mode;
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
</head>
<body class="{{ body_class }}">
<a class="skip-link" href="#main">跳到主要内容</a>
<div class="progress" aria-hidden="true"><span class="progress__bar" id="reading-progress"></span></div>

<header class="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="{{ base }}index.html">
      <span class="nav__mark" aria-hidden="true"></span>
      <span class="nav__name">{{ site_title }}</span>
    </a>
    <nav class="nav__links" aria-label="主导航">
      {{ nav_links }}
    </nav>
    <div class="nav__tools">
      <a class="icon-btn" href="{{ base }}search.html" title="搜索" aria-label="搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </a>
      <button class="icon-btn" id="theme-toggle" type="button" title="切换外观" aria-label="切换外观">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.6 8.6 0 1 0 10.9 10.9z"/></svg>
      </button>
      <a class="icon-btn nav__github" href="{{ github_url }}" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2a9.8 9.8 0 0 0-3.1 19.1c.5.1.7-.2.7-.5v-1.9c-2.7.6-3.3-1.2-3.3-1.2-.4-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.2-4.5-1.1-4.5-4.9 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.8-2.3 4.7-4.5 4.9.3.3.7 1 .7 2v2.9c0 .3.2.6.7.5A9.8 9.8 0 0 0 12 2.2z"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="main" id="main">
{{ content }}
</main>

<footer class="footer">
  <div class="footer__inner">{{ footer_html }}</div>
</footer>

<button class="to-top" id="to-top" type="button" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
</button>

<script>window.__BLOG__ = {{ runtime_json }};</script>
<script src="{{ base }}static/js/app.js" defer></script>
<script src="{{ base }}static/js/metrics.js" defer></script>
<script src="{{ base }}static/js/comments.js" defer></script>
{{ extra_foot }}
</body>
</html>
