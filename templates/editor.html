<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑器 · {{ site_title }}</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --accent: #0071e3;
  --bg: #fbfbfd;
  --card: #ffffff;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #86868b;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --code-bg: #1d1d1f;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
}

[data-theme="dark"] {
  --accent: #0a84ff;
  --bg: #000000;
  --card: #1c1c1e;
  --text: #f5f5f7;
  --text-secondary: #a1a1a6;
  --text-tertiary: #8e8e93;
  --border: rgba(255,255,255,0.1);
  --border-strong: rgba(255,255,255,0.2);
  --code-bg: #15151a;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  font-family: var(--font-sans);
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ---------- 顶栏 ---------- */
.toolbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0 0.9rem;
  height: 54px;
  flex: none;
  background: rgba(251, 251, 253, 0.78);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

[data-theme="dark"] .toolbar { background: rgba(10, 10, 12, 0.78); }

.toolbar__title {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-weight: 600;
  font-size: 0.92rem;
  white-space: nowrap;
}

.toolbar__mark {
  width: 16px; height: 16px; border-radius: 6px;
  background: linear-gradient(145deg, var(--accent), #5ac8fa 60%, #bf5af2);
}

.toolbar__spacer { flex: 1 1 auto; }

.toolbar__group { display: flex; align-items: center; gap: 0.3rem; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.38rem 0.72rem;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--card);
  color: var(--text);
  font-family: inherit;
  font-size: 0.8rem;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 0.2s var(--ease), color 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease);
}

.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip:active { transform: scale(0.96); }

.chip--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.chip--primary:hover { background: #0062c4; color: #fff; }
.chip:disabled { opacity: 0.45; cursor: not-allowed; }

select.chip { appearance: none; padding-right: 1.4rem; max-width: 220px; }

.status {
  font-size: 0.76rem;
  color: var(--text-tertiary);
  white-space: nowrap;
  min-width: 6rem;
  text-align: right;
}

/* ---------- 主体 ---------- */
.workspace {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
}

.pane {
  flex: 1 1 50%;
  min-width: 0;
  overflow-y: auto;
  padding: 1.4rem 1.6rem 3rem;
}

.pane--source { border-right: 1px solid var(--border); }

#source {
  width: 100%;
  height: 100%;
  min-height: 60vh;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.75;
  tab-size: 4;
}

#source::placeholder { color: var(--text-tertiary); }

.preview { font-size: 16px; line-height: 1.75; }
.preview h1 { font-size: 1.7rem; letter-spacing: -0.02em; margin: 0 0 0.6rem; }
.preview h2 { font-size: 1.3rem; margin: 1.6rem 0 0.6rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
.preview h3 { font-size: 1.1rem; margin: 1.2rem 0 0.4rem; }
.preview p { margin: 0.8rem 0; }
.preview ul, .preview ol { padding-left: 1.4rem; }
.preview a { color: var(--accent); }
.preview blockquote {
  margin: 1rem 0; padding: 0.7rem 1rem;
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  background: rgba(128,128,128,0.08);
  color: var(--text-secondary);
}
.preview code {
  padding: 0.12em 0.35em; border-radius: 5px;
  background: rgba(128,128,128,0.16);
  font-family: var(--font-mono); font-size: 0.86em;
}
.preview pre {
  background: var(--code-bg); color: #f5f5f7;
  padding: 1rem 1.15rem; border-radius: 12px; overflow-x: auto;
}
.preview pre code { background: none; padding: 0; color: inherit; }
.preview img { max-width: 100%; border-radius: 10px; }
.preview table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.92rem; }
.preview th, .preview td { border: 1px solid var(--border); padding: 0.5rem 0.7rem; text-align: left; }
.preview th { background: rgba(128,128,128,0.1); }
.preview hr { border: none; border-top: 1px solid var(--border); margin: 1.6rem 0; }

/* ---------- 提示条 ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 1.6rem;
  transform: translate(-50%, 12px);
  padding: 0.6rem 1.2rem;
  border-radius: 999px;
  background: rgba(29, 29, 31, 0.92);
  color: #fff;
  font-size: 0.85rem;
  box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s var(--ease), transform 0.25s var(--ease), visibility 0.25s var(--ease);
  z-index: 999;
}

.toast.is-visible { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

/* ---------- 弹窗 ---------- */
.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.38);
  backdrop-filter: blur(6px);
  z-index: 1000;
  padding: 1rem;
}

.modal.is-open { display: flex; }

.modal__box {
  width: 100%;
  max-width: 420px;
  padding: 1.5rem;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: 0 30px 70px rgba(0,0,0,0.3);
}

.modal__title { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }

.modal__label {
  display: block;
  margin: 0.75rem 0 0.3rem;
  font-size: 0.78rem;
  color: var(--text-tertiary);
}

.modal__input {
  width: 100%;
  padding: 0.55rem 0.75rem;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.modal__input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }

.modal__row { display: flex; gap: 0.5rem; }
.modal__row .modal__input { flex: 1; }

.modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
  margin-top: 1.4rem;
}

@media (max-width: 860px) {
  .workspace { flex-direction: column; }
  .pane--source { border-right: none; border-bottom: 1px solid var(--border); max-height: 48vh; }
  #source { min-height: 40vh; }
  .toolbar__title span { display: none; }
  .status { display: none; }
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar__title">
    <span class="toolbar__mark" aria-hidden="true"></span>
    <span>编辑器</span>
  </div>

  <select class="chip" id="file-select" aria-label="选择文章">
    <option value="">选择文章…</option>
  </select>

  <button class="chip" id="btn-new" type="button">新建</button>
  <button class="chip" id="btn-delete" type="button" disabled>删除</button>

  <span class="toolbar__spacer"></span>

  <div class="toolbar__group">
    <button class="chip" data-insert="table" type="button" title="插入表格">表格</button>
    <button class="chip" data-insert="image" type="button" title="插入图片">图片</button>
    <button class="chip" data-insert="file" type="button" title="插入附件">附件</button>
    <button class="chip" data-insert="code" type="button" title="插入代码块">代码</button>
  </div>

  <span class="toolbar__spacer"></span>

  <span class="status" id="status">正在连接…</span>
  <a class="chip" href="/" target="_blank" rel="noopener">预览站</a>
  <button class="chip" id="btn-download" type="button">下载</button>
  <button class="chip chip--primary" id="btn-save" type="button" disabled>保存</button>
</div>

<div class="workspace">
  <div class="pane pane--source">
    <textarea id="source" spellcheck="false" placeholder="在这里写文章…&#10;&#10;---&#10;title: 文章标题&#10;date: 2026-01-01&#10;tags: 标签一, 标签二&#10;---&#10;&#10;## 小标题"></textarea>
  </div>
  <div class="pane preview" id="preview"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="file-image" accept="image/*" hidden>
<input type="file" id="file-attach" hidden>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal__box">
    <h2 class="modal__title" id="modal-title">插入</h2>
    <label class="modal__label" id="modal-label-1">描述</label>
    <input class="modal__input" id="modal-input-1" type="text">
    <label class="modal__label" id="modal-label-2">路径</label>
    <div class="modal__row">
      <input class="modal__input" id="modal-input-2" type="text">
      <button class="chip" id="modal-upload" type="button">上传</button>
    </div>
    <div class="modal__actions">
      <button class="chip" id="modal-cancel" type="button">取消</button>
      <button class="chip chip--primary" id="modal-confirm" type="button">插入</button>
    </div>
  </div>
</div>

<script src="/static/marked.min.js"></script>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    options: { enableMenu: false }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  'use strict';

  var source = document.getElementById('source');
  var preview = document.getElementById('preview');
  var fileSelect = document.getElementById('file-select');
  var statusEl = document.getElementById('status');
  var btnSave = document.getElementById('btn-save');
  var btnDelete = document.getElementById('btn-delete');
  var toastEl = document.getElementById('toast');

  var state = {
    serverMode: false,
    currentFile: '',
    dirty: false,
    modalKind: null
  };

  var DRAFT_KEY = 'blog-editor-draft';
  var THEME_KEY = 'blog-appearance';

  /* ---------- 主题跟随站点 ---------- */
  try {
    var savedTheme = localStorage.getItem(THEME_KEY) || 'auto';
    var isDark = savedTheme === 'dark' ||
      (savedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
  } catch (e) { /* 忽略 */ }

  /* ---------- 小工具 ---------- */
  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('is-visible');
    window.clearTimeout(toast._timer);
    toast._timer = window.setTimeout(function () {
      toastEl.classList.remove('is-visible');
    }, 1800);
  }

  function setStatus(text) { statusEl.textContent = text; }

  function markDirty() { state.dirty = true; }
  function markClean() { state.dirty = false; }

  /* ---------- API ---------- */
  function refreshList(selectName) {
    return fetch('/api/posts')
      .then(function (response) {
        if (!response.ok) throw new Error('no server');
        return response.json();
      })
      .then(function (posts) {
        fileSelect.innerHTML = '<option value="">选择文章…</option>';
        posts.forEach(function (post) {
          var option = document.createElement('option');
          option.value = post.filename;
          option.textContent = post.title + (post.date ? ' · ' + post.date : '');
          fileSelect.appendChild(option);
        });
        if (selectName) fileSelect.value = selectName;
        state.serverMode = true;
        setStatus('已连接 · ' + posts.length + ' 篇');
        btnSave.disabled = false;
      })
      .catch(function () {
        state.serverMode = false;
        setStatus('离线模式');
        btnSave.disabled = false;
      });
  }

  /* ---------- 预览 ---------- */
  var renderTimer = null;

  function frontmatterSplit(text) {
    var normalized = text.replace(/\r\n/g, '\n');
    if (normalized.indexOf('---') !== 0) return normalized;
    var lines = normalized.split('\n');
    for (var i = 1; i < lines.length; i += 1) {
      var line = lines[i].trim();
      if (line === '---' || line === '...') {
        return lines.slice(i + 1).join('\n');
      }
    }
    return normalized;
  }

  function escapeHtml(text) {
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function sanitize(html) {
    var host = document.createElement('div');
    host.innerHTML = html;
    var banned = host.querySelectorAll('script, iframe, object, embed, form, input, style, link, meta, base');
    for (var i = 0; i < banned.length; i += 1) {
      banned[i].parentNode.removeChild(banned[i]);
    }
    var all = host.querySelectorAll('*');
    for (var j = 0; j < all.length; j += 1) {
      var attrs = all[j].attributes;
      for (var k = attrs.length - 1; k >= 0; k -= 1) {
        var name = attrs[k].name.toLowerCase();
        var value = attrs[k].value || '';
        if (name.indexOf('on') === 0) {
          all[j].removeAttribute(attrs[k].name);
        } else if ((name === 'href' || name === 'src') &&
                   value.trim().toLowerCase().indexOf('javascript:') === 0) {
          all[j].removeAttribute(attrs[k].name);
        }
      }
    }
    return host.innerHTML;
  }

  var mathRetry = 0;

  function typesetMath() {
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([preview]).catch(function () {});
      mathRetry = 0;
      return;
    }
    if (mathRetry < 40) {
      mathRetry += 1;
      window.setTimeout(typesetMath, 200);
    }
  }

  function renderPreview() {
    window.clearTimeout(renderTimer);
    renderTimer = window.setTimeout(function () {
      var body = frontmatterSplit(source.value);
      if (!body.trim()) {
        preview.innerHTML = '<p style="color:var(--text-tertiary)">预览区域</p>';
        return;
      }

      var html;
      try {
        html = window.marked
          ? marked.parse(body, { gfm: true, breaks: false })
          : '<pre>' + escapeHtml(body) + '</pre>';
      } catch (err) {
        html = '<pre>' + escapeHtml(body) + '</pre>';
      }

      var scroll = preview.scrollTop;
      preview.innerHTML = sanitize(html);
      preview.scrollTop = scroll;

      if (window.hljs) {
        var blocks = preview.querySelectorAll('pre code');
        for (var i = 0; i < blocks.length; i += 1) {
          try { hljs.highlightElement(blocks[i]); } catch (e) { /* 忽略 */ }
        }
      }

      typesetMath();
    }, 140);
  }

  /* ---------- 插入片段 ---------- */
  function insertAtCursor(text, caretOffset) {
    var start = source.selectionStart;
    var end = source.selectionEnd;
    source.value = source.value.slice(0, start) + text + source.value.slice(end);
    var caret = start + (typeof caretOffset === 'number' ? caretOffset : text.length);
    source.focus();
    source.selectionStart = source.selectionEnd = caret;
    markDirty();
    renderPreview();
  }

  function openModal(kind) {
    state.modalKind = kind;
    var title = document.getElementById('modal-title');
    var label1 = document.getElementById('modal-label-1');
    var label2 = document.getElementById('modal-label-2');
    document.getElementById('modal-input-1').value = '';
    var pathInput = document.getElementById('modal-input-2');
    pathInput.value = '';

    if (kind === 'image') {
      title.textContent = '插入图片';
      label1.textContent = '图片描述（alt）';
      label2.textContent = '图片路径';
      pathInput.placeholder = 'static/images/photo.png';
    } else {
      title.textContent = '插入附件';
      label1.textContent = '显示文字';
      label2.textContent = '附件路径';
      pathInput.placeholder = 'static/attachments/file.zip';
    }

    document.getElementById('modal').classList.add('is-open');
    pathInput.focus();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('is-open');
    state.modalKind = null;
  }

  function confirmModal() {
    var label = document.getElementById('modal-input-1').value.trim();
    var path = document.getElementById('modal-input-2').value.trim();
    if (!path) {
      toast('请填写路径');
      return;
    }
    if (state.modalKind === 'image') {
      insertAtCursor('![' + (label || '图片') + '](' + path + ')');
    } else {
      insertAtCursor('[' + (label || '附件') + '](' + path + ')');
    }
    closeModal();
  }

  /* ---------- 上传 ---------- */
  function upload(kind, inputId) {
    var picker = document.getElementById(inputId);
    picker.value = '';
    picker.click();

    picker.onchange = function () {
      var file = picker.files && picker.files[0];
      if (!file) return;
      if (!state.serverMode) {
        toast('离线模式无法上传，请手动填写路径');
        return;
      }

      var form = new FormData();
      form.append('file', file);
      toast('上传中…');

      fetch('/api/upload?type=' + kind, { method: 'POST', body: form })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (!data.ok) throw new Error(data.error || '上传失败');
          document.getElementById('modal-input-2').value = data.path;
          var labelInput = document.getElementById('modal-input-1');
          if (!labelInput.value) labelInput.value = file.name;
          toast('已上传：' + file.name);
        })
        .catch(function (err) { toast(err.message); });
    };
  }

  /* ---------- 加载 / 保存 / 删除 ---------- */
  function loadPost(filename) {
    if (!filename) return;
    if (state.dirty && !window.confirm('当前修改还没保存，确定切换文章？')) {
      fileSelect.value = state.currentFile;
      return;
    }
    fetch('/api/posts/' + encodeURIComponent(filename))
      .then(function (response) {
        if (!response.ok) throw new Error('读取失败');
        return response.text();
      })
      .then(function (text) {
        source.value = text;
        state.currentFile = filename;
        markClean();
        btnDelete.disabled = false;
        setStatus('正在编辑：' + filename);
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 忽略 */ }
        renderPreview();
      })
      .catch(function (err) { toast(err.message); });
  }

  function savePost() {
    if (!state.serverMode) {
      toast('离线模式，请用「下载」保存文件');
      download();
      return;
    }

    var filename = state.currentFile;
    if (!filename) {
      var match = source.value.match(/^title:[ \t]*(.+)$/m);
      var base = (match ? match[1] : '').trim() || 'untitled';
      base = base.replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
      var typed = window.prompt('保存为文件名（.txt）', base + '.txt');
      if (!typed) return;
      filename = typed.trim();
      if (!/\.txt$/i.test(filename)) filename += '.txt';
    } else if (!window.confirm('覆盖 ' + filename + '？')) {
      return;
    }

    btnSave.disabled = true;
    fetch('/api/posts/' + encodeURIComponent(filename), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
      body: source.value
    })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        if (!data.ok) throw new Error(data.error || '保存失败');
        state.currentFile = data.filename;
        markClean();
        btnDelete.disabled = false;
        toast('已保存：' + data.filename);
        setStatus(String(data.build || '已保存'));
        return refreshList(data.filename);
      })
      .catch(function (err) { toast(err.message); })
      .finally(function () { btnSave.disabled = false; });
  }

  function deletePost() {
    if (!state.currentFile) return;
    if (!window.confirm('确定删除 ' + state.currentFile + '？这一步无法撤销。')) return;

    fetch('/api/posts/' + encodeURIComponent(state.currentFile), { method: 'DELETE' })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        if (!data.ok) throw new Error(data.error || '删除失败');
        toast('已删除：' + state.currentFile);
        state.currentFile = '';
        source.value = '';
        btnDelete.disabled = true;
        markClean();
        renderPreview();
        return refreshList('');
      })
      .catch(function (err) { toast(err.message); });
  }

  function newPost() {
    if (state.dirty && !window.confirm('当前修改还没保存，确定新建？')) return;
    var today = new Date().toISOString().slice(0, 10);
    source.value = '---\ntitle: \ndate: ' + today + '\ntags: \n---\n\n## 小标题\n\n从这里开始写。\n';
    state.currentFile = '';
    btnDelete.disabled = true;
    markDirty();
    renderPreview();
    source.focus();
    source.selectionStart = source.selectionEnd = source.value.indexOf('title: ') + 7;
    toast('已新建草稿，填好标题后点保存');
  }

  function download() {
    var name = state.currentFile || 'article.txt';
    var blob = new Blob([source.value], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = name;
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('已下载：' + name);
  }

  /* ---------- 事件绑定 ---------- */
  fileSelect.addEventListener('change', function () { loadPost(fileSelect.value); });
  btnSave.addEventListener('click', savePost);
  btnDelete.addEventListener('click', deletePost);
  document.getElementById('btn-new').addEventListener('click', newPost);
  document.getElementById('btn-download').addEventListener('click', download);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', confirmModal);
  document.getElementById('modal-upload').addEventListener('click', function () {
    upload(state.modalKind === 'image' ? 'image' : 'attachment',
           state.modalKind === 'image' ? 'file-image' : 'file-attach');
  });
  document.getElementById('modal').addEventListener('click', function (event) {
    if (event.target.id === 'modal') closeModal();
  });

  var insertButtons = document.querySelectorAll('[data-insert]');
  for (var i = 0; i < insertButtons.length; i += 1) {
    insertButtons[i].addEventListener('click', function () {
      var kind = this.getAttribute('data-insert');
      if (kind === 'table') {
        insertAtCursor('| 列一 | 列二 |\n| --- | --- |\n| 内容 | 内容 |\n');
        toast('已插入表格模板');
      } else if (kind === 'code') {
        var lang = window.prompt('代码语言（可留空）', 'python') || '';
        var snippet = '```' + lang + '\n\n```';
        insertAtCursor(snippet, 3 + lang.length + 1);
      } else {
        openModal(kind);
      }
    });
  }

  source.addEventListener('input', function () {
    markDirty();
    if (!state.serverMode) {
      try { localStorage.setItem(DRAFT_KEY, source.value); } catch (e) { /* 忽略 */ }
    }
    renderPreview();
  });

  source.addEventListener('keydown', function (event) {
    if ((event.metaKey || event.ctrlKey) && event.key === 's') {
      event.preventDefault();
      savePost();
    }
    if (event.key === 'Tab') {
      event.preventDefault();
      insertAtCursor('    ');
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeModal();
  });

  window.addEventListener('beforeunload', function (event) {
    if (!state.dirty) return;
    event.preventDefault();
    event.returnValue = '';
  });

  /* ---------- 启动 ---------- */
  refreshList('').then(function () {
    if (!state.serverMode) {
      try {
        var draft = localStorage.getItem(DRAFT_KEY);
        if (draft) {
          source.value = draft;
          toast('已恢复上次未保存的草稿');
        }
      } catch (e) { /* 忽略 */ }
    }
    renderPreview();
  });
})();
</script>
</body>
</html>
