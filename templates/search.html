<section class="page-head">
  <h1 class="page-head__title">搜索</h1>
  <p class="page-head__lead">搜索标题、正文和标签，按 Esc 清空。</p>
</section>

<div class="search">
  <div class="search__field">
    <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="search-input" class="search__input" type="search" autocomplete="off"
           placeholder="输入关键词…" aria-label="搜索文章" data-index="{{ index_url }}">
    <kbd class="search__kbd">/</kbd>
  </div>
  <p class="search__status" id="search-status" aria-live="polite"></p>
  <div class="search__results" id="search-results"></div>
  <noscript><p class="empty">搜索需要启用 JavaScript。</p></noscript>
</div>
