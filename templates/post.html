<article class="post">
  <header class="post__head">
    <h1 class="post__title">{{ title }}</h1>
    <div class="post__meta">{{ meta }}</div>
    {{ tags }}
  </header>

  <div class="post__layout">
    <div class="prose post__body" id="post-body">
{{ body }}
    </div>
    <aside class="post__aside">
{{ toc }}
    </aside>
  </div>

  {{ pager }}

  {{ comments }}
</article>
